# Disposable PostgreSQL for the history store integration tests:
#   docker compose -f tests/compose/history_store.yaml up -d
#   TEST_DATABASE_URL=postgresql://mdh:mdh@localhost:55432/mdh_test uv run pytest tests/integration/test_history_store.py
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mdh
      POSTGRES_PASSWORD: mdh
      POSTGRES_DB: mdh_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdh -d mdh_test"]
      interval: 2s
      timeout: 3s
      retries: 20
